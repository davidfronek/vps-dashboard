name: 🚀 Signalizace změn na VPS

on:
  push:
    branches:
      - main  # Spustí se při pushi do hlavní větve main

jobs:
  signal-vps:
    runs-on: ubuntu-latest
    steps:
    - name: 🔐 Spuštění aktualizace na VPS přes SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          set -Eeuo pipefail

          APP_DIR=/srv/apps/onremote.cz
          SERVICE=vps-app-onremote-cz
          WWW_HOME="$(getent passwd www-data | cut -d: -f6)"

          install -d -o www-data -g www-data -m 0700 "$WWW_HOME/.ssh"
          ssh-keyscan -H github.com > "$WWW_HOME/.ssh/known_hosts.new"
          chown www-data:www-data "$WWW_HOME/.ssh/known_hosts.new"
          chmod 0600 "$WWW_HOME/.ssh/known_hosts.new"
          mv "$WWW_HOME/.ssh/known_hosts.new" "$WWW_HOME/.ssh/known_hosts"

          if [[ ! -f "$WWW_HOME/.ssh/id_ed25519" ]]; then
            runuser -u www-data -- ssh-keygen -q -t ed25519 -N "" -C "vps-dashboard-deploy" -f "$WWW_HOME/.ssh/id_ed25519"
          fi
          if [[ ! -f "$WWW_HOME/.ssh/github_account_ed25519" ]]; then
            runuser -u www-data -- ssh-keygen -q -t ed25519 -N "" -C "vps-dashboard-account" -f "$WWW_HOME/.ssh/github_account_ed25519"
          fi
          echo "GitHub account key: $(cat "$WWW_HOME/.ssh/github_account_ed25519.pub")"

          HELPER_SOURCE="$(mktemp)"
          trap 'rm -f "$HELPER_SOURCE"' EXIT
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/davidfronek/vps-dashboard/main/scripts/domain-admin.sh \
            --output "$HELPER_SOURCE"
          install -o root -g root -m 0755 "$HELPER_SOURCE" /usr/local/sbin/vps-dashboard-domains
          install -d -o root -g www-data -m 0750 /var/lib/vps-dashboard
          if [[ ! -f /var/lib/vps-dashboard/todos-admin.json ]]; then
            printf '[]\n' > /var/lib/vps-dashboard/todos-admin.json
          fi
          chown www-data:www-data /var/lib/vps-dashboard/todos-admin.json
          chmod 0640 /var/lib/vps-dashboard/todos-admin.json

          /usr/local/sbin/vps-dashboard-domains domain-deploy \
            onremote.cz \
            https://github.com/davidfronek/vps-dashboard.git \
            main \
            3000 \
            1 \
            1 \
            1

          grep -Fq "Všechny sledované služby jsou dostupné a běží" "$APP_DIR/src/app/dashboard.tsx"
          systemctl is-active --quiet "$SERVICE"
