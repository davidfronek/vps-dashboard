name: 🚀 Signalizace změn na VPS

on:
  push:
    branches:
      - main  # Spustí se při pushi do hlavní větve main

jobs:
  signal-vps:
    runs-on: ubuntu-latest
    steps:
    - name: 🔐 Spuštění aktualizace na VPS přes SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          set -Eeuo pipefail

          APP_DIR=/srv/apps/onremote.cz
          SERVICE=vps-app-onremote-cz
          COMMIT=${{ github.sha }}

          /usr/local/bin/update-apps.sh "${{ github.event.repository.name }}"

          if [[ "$(git -c safe.directory="$APP_DIR" -C "$APP_DIR" rev-parse HEAD 2>/dev/null || true)" != "$COMMIT" ]]; then
            git -c safe.directory="$APP_DIR" -C "$APP_DIR" fetch --prune origin main
            git -c safe.directory="$APP_DIR" -C "$APP_DIR" checkout -B main origin/main
            npm --prefix "$APP_DIR" ci
            npm --prefix "$APP_DIR" run build
            systemctl restart "$SERVICE"
          fi

          test "$(git -c safe.directory="$APP_DIR" -C "$APP_DIR" rev-parse HEAD)" = "$COMMIT"
          systemctl is-active --quiet "$SERVICE"
